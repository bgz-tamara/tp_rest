openapi: 3.1.1
info:
  title: Movie Service API
  description: Consultation et gestion du catalogue de films.
  version: "1.0.0"
  contact:
    name: Ludivine Levallois
    email: ludivine.levallois@imt-atlantique.net
servers:
  - url: http://localhost:3200

tags:
  - name: admin
    description: Routes réservées aux administrateurs (JWT requis)
  - name: user
    description: Routes publiques

paths:
  /:
    get:
      tags: [user]
      summary: Page d'accueil
      operationId: home
      responses:
        "200":
          description: Message de bienvenue
          content:
            text/html:
              schema: { type: string }

  /json:
    get:
      tags: [user]
      summary: Liste tous les films
      operationId: get_json
      responses:
        "200":
          description: Liste des films
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movie" }

  /movies/{movieid}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [user]
      summary: Récupère un film par son ID
      operationId: get_movie_byid
      responses:
        "200": { $ref: "#/components/responses/Movie" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      summary: Ajoute un film
      operationId: add_movie
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Movie" }
      responses:
        "200":
          description: Film ajouté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidToken" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [admin]
      summary: Supprime un film
      operationId: del_movie
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Movie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidToken" }
        "500": { $ref: "#/components/responses/ServerError" }

  /moviesbytitle:
    get:
      tags: [user]
      summary: Récupère un film par son titre exact
      operationId: get_movie_bytitle
      parameters:
        - name: title
          in: query
          required: true
          schema: { type: string, example: The Martian }
      responses:
        "200": { $ref: "#/components/responses/Movie" }
        "500": { $ref: "#/components/responses/ServerError" }

  /movies/name_update/{movieid}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    patch:
      tags: [admin]
      summary: Modifie le titre d'un film
      operationId: update_movie_name
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, example: Creed II }
      responses:
        "200": { $ref: "#/components/responses/Movie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidToken" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenu via POST /login sur le service User (port 3203)

  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Movie:
      type: object
      required: [id, title, rating, director]
      properties:
        id: { type: string, format: uuid, example: 267eedb8-0f5d-42d5-8f43-72426b9fb3e6 }
        title: { type: string, example: Creed }
        rating: { type: number, example: 8.8 }
        director: { type: string, example: Ryan Coogler }
    Message:
      type: object
      properties:
        message: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }

  responses:
    Movie:
      description: Le film concerné
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Movie" }
    Unauthorized:
      description: Token absent ou expiré
    InvalidToken:
      description: Token invalide
    Forbidden:
      description: Droits administrateur requis
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Film introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Film introuvable, ou ID déjà existant (ajout)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
